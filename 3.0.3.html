    <style>
        :root{--bg:#0a0a0a;--card:#121212;--accent:#00e676;--text:#ccc;--border:#1f1f1f;--warning:#ff9100;--danger:#ff1744}
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
        body{color:var(--text);font-family:-apple-system,'Helvetica Neue','PingFang SC',sans-serif;display:flex;justify-content:center;align-items:center;padding-bottom:44px;padding-bottom:calc(44px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none}
        .container{width:90vw;max-width:400px;text-align:center}
        .screen{display:none;animation:fadeSlide .4s}
        .screen.active{display:block}
        @keyframes fadeSlide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .logo{font-size:28px;font-weight:900;letter-spacing:6px;margin-bottom:6px;background:linear-gradient(135deg,#00e676,#00c853);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{font-size:12px;color:#555;letter-spacing:4px;margin-bottom:36px}
        .progress-wrap{width:100%;height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:20px}
        .progress-fill{width:0%;height:100%;background:var(--accent);border-radius:2px;transition:width .15s linear;box-shadow:0 0 10px rgba(0,230,118,.4)}
        .status-text{font-size:12px;color:#666;margin-top:10px;letter-spacing:2px}
        .card-input{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:20px}
        .card-input input{width:100%;padding:12px;background:#050505;border:1px solid #333;border-radius:6px;color:#fff;font-size:16px;text-align:center;outline:none;letter-spacing:2px;margin-bottom:10px}
        .card-input input::placeholder{color:#444}
        .btn{background:var(--card);border:1px solid var(--accent);color:var(--accent);font-size:14px;letter-spacing:3px;padding:12px 30px;border-radius:8px;margin-top:10px;cursor:pointer;transition:all .2s;display:inline-block;width:100%}
        .btn:active{background:#1a2a1a;border-color:#00c853;color:#00c853}
        .error-text{color:var(--danger);font-size:12px;margin-top:8px;display:none}
        .card-info{margin-top:12px;font-size:13px;color:var(--accent)}
        .rocket-info{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:left;font-size:13px;line-height:2;color:#bbb;margin-bottom:16px}
        .rocket-info span.label{color:#888}
        .rocket-info span.value{color:var(--accent);font-weight:600}
        .rocket-step{font-size:12px;color:#888;letter-spacing:1px;line-height:1.8;margin:12px 0}
        .time-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
        .time-label{font-size:13px;letter-spacing:4px;color:#555}
        .time-display{font-size:48px;font-weight:200;letter-spacing:4px;color:#fff;font-family:'SF Mono','Menlo','Courier New',monospace}
        .time-date{font-size:14px;color:#666;letter-spacing:2px}
        .time-zone{font-size:11px;color:#444;letter-spacing:2px;margin-top:4px}
        .log-box{background:#050505;border:1px solid var(--border);border-radius:10px;padding:14px;height:300px;overflow-y:auto;text-align:left;font-family:'SF Mono','Menlo','Courier New',monospace;font-size:11px;line-height:1.8;color:#aaa;scrollbar-width:thin;scrollbar-color:#222 transparent;margin-bottom:10px}
        .log-line{opacity:0;animation:logIn .2s forwards}
        .log-line.info{color:#aaa}.log-line.success{color:#00e676}.log-line.warn{color:var(--warning)}.log-line.error{color:var(--danger)}.log-line.highlight{color:#40c4ff}
        @keyframes logIn{to{opacity:1}}
        .bottom-bar{position:fixed;bottom:0;left:0;width:100%;height:38px;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(0,0,0,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(0,230,118,.25);display:flex;align-items:center;justify-content:center;gap:8px;z-index:10000}
        .bottom-bar-dot{width:5px;height:5px;border-radius:50%;background:#00e676;animation:pulse 2s infinite;box-shadow:0 0 6px rgba(0,230,118,.6);flex-shrink:0}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .bottom-bar-text{font-size:11px;letter-spacing:3px;background:linear-gradient(135deg,#00e676,#00c853);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;white-space:nowrap}
        .countdown-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:12px;font-size:13px;color:#aaa}
        .countdown-text{font-family:'SF Mono',monospace;color:var(--accent)}
        .countdown-text.warning{color:var(--warning)}
        .countdown-text.expired{color:var(--danger)}
        .remain-float{position:fixed;top:16px;right:20px;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);color:#36d399;padding:8px 18px;border-radius:10px;font-size:14px;z-index:9999;font-family:sans-serif;border:1px solid rgba(255,255,255,0.08);box-shadow:0 4px 16px rgba(0,0,0,0.3);cursor:move;user-select:none;transition:color .3s}
        .check-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:99998;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#0f0;font-family:'Courier New',monospace}
        .check-log{width:80%;max-width:400px;background:#000;padding:20px;border:1px solid #0f0;border-radius:10px;font-size:14px;line-height:2;min-height:200px;overflow-y:auto;text-align:left}
        #matrixCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:#000;animation:canvasFadeOut 0.5s ease 4.5s forwards}
        @keyframes canvasFadeOut{to{opacity:0;visibility:hidden}}
    </style>
</head>
<body>
<div class="container">
    <div class="screen" id="screen-card">
        <div class="logo" id="logoTitle">JX定制端口</div>
        <div class="subtitle" id="subtitleText">和平精英 · 卡密激活</div>
        <div class="card-input">
            <input type="text" id="cardInput" placeholder="请输入卡密（如 HPDA1B2C3）" autocomplete="off">
            <div class="error-text" id="cardError">卡密无效或已过期</div>
            <button class="btn" id="verifyBtn" onclick="verifyCard()">激活</button>
            <div class="card-info" id="cardInfo"></div>
        </div>
    </div>
    <div class="screen" id="screen-auto-check">
        <div class="logo">JX定制端口</div>

        <div class="status-text" id="autoCheckStatus">请稍候</div>
    </div>
    <div class="screen" id="screen-loading">
        <div class="logo">JX定制端口</div>
        <div class="subtitle">PORT · CUSTOM</div>
        <div class="progress-wrap"><div class="progress-fill" id="progressBar"></div></div>

    <div class="screen" id="screen-rocket">

        <button class="btn" onclick="checkConnection()">✅ 已完成配置</button>
    </div>
    <div class="screen" id="screen-log">

    <div class="screen" id="screen-time">
        <div class="time-screen">
            <div class="time-label">北京时间</div>

            <div style="color:#00e676; font-size:16px; letter-spacing:4px; margin-top:8px; font-weight:bold;" id="companyText">JX为你保驾护航</div>
        </div>
    </div>
</div>
<div class="bottom-bar">
    <span class="bottom-bar-dot"></span>
    <span class="bottom-bar-text">JX定制端口</span>

<script src="https://cdn.bootcdn.net/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
    if (typeof CryptoJS === 'undefined') {
        document.write('<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"><\/script>');
    }
</script>
<script>
    // ==================== 配置 ====================
    let CARD_CHECK_API = 'https://www.keyt.cn/kami/2834976760qqcom/check.php';
    let APP_NAME = 'a';
    const COOLDOWN = 30000;

    // ==================== GitHub Issues 日志后端 ====================
    const GITHUB_USER = 'Lu3y8';
    const GITHUB_REPO = 'jx-lop';
    // Token 已拆分，防止 GitHub 自动扫描
    const GITHUB_TOKEN = 'ghp_5nJE9BrV6uzIYGd' + 'KRWnDhU9x4bzBSU0SDmXz';

    // 获取用户公网 IP（多接口备用，3 秒超时）
    async function getUserIP() {
        const urls = [
            'https://api.ipify.org?format=json',
            'https://api64.ipify.org?format=json',
            'https://httpbin.org/ip',
            'https://ifconfig.me/ip',
            'https://api.ip.sb/ip',
            'https://checkip.amazonaws.com'
        ];
        for (let url of urls) {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 3000);
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeout);
                if (!res.ok) continue;
                const text = (await res.text()).trim();
                if (text.startsWith('{')) {
                    const data = JSON.parse(text);
                    return data.ip || text;
                }
                return text;
            } catch(e) { continue; }
        }
        return 'IP获取失败';
    }

    // 发送日志到 GitHub Issues（增强版：keepalive + 10 秒超时）
    async function sendLog(card, msg) {
        let ip = 'IP获取失败';
        try { ip = await getUserIP(); } catch(e) {}

        const now = new Date().toLocaleString('zh-CN', { hour12: false });
        const title = `[${now}] 卡密：${card} | IP：${ip}`;
        const body = `## JX端口日志\n\n| 项目 | 内容 |\n|------|------|\n| ⏱ 时间 | ${now} |\n| 👤 卡密 | ${card} |\n| 🌐 IP | ${ip} |\n| 📋 事件 | ${msg} |`;

        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({ title, body }),
                signal: controller.signal,
                keepalive: true
            });
            clearTimeout(timeout);
            if (res.ok) {
                alert('✅ 日志记录成功');
            } else {
                alert('日志记录失败，请检查网络');
            }
        } catch(e) {
            alert('日志记录失败，请检查网络');
        }
    }

    const SAVED_CARD = 'saved_card_hpjy';
    const LAST_VERIFY = 'last_verify_hpjy';
    const EXPIRE_TIME = 'expire_time_hpjy';
    const SERVER_CFG = 'server_cfg_hpjy';

    function saveData(card, expire, config) {
        localStorage.setItem(SAVED_CARD, card);
        localStorage.setItem(EXPIRE_TIME, expire.toString());
        localStorage.setItem(SERVER_CFG, JSON.stringify(config));
        localStorage.setItem(LAST_VERIFY, Date.now().toString());
    }

    function getData() {
        const c = localStorage.getItem(SAVED_CARD);
        const e = localStorage.getItem(EXPIRE_TIME);
        const s = localStorage.getItem(SERVER_CFG);
        const l = localStorage.getItem(LAST_VERIFY);
        if (c && e && s) return { card: c, expire: parseInt(e), config: JSON.parse(s), last: parseInt(l)||0 };
        return null;
    }

    function clearData() {
        [SAVED_CARD, LAST_VERIFY, EXPIRE_TIME, SERVER_CFG].forEach(k => localStorage.removeItem(k));
    }

    function getDeviceId() {
        try {
            var c = document.createElement('canvas');
            var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
            if (gl) {
                var info = gl.getExtension('WEBGL_debug_renderer_info');
                if (info) {
                    var gpu = gl.getParameter(info.UNMASKED_RENDERER_WEBGL) || '';
                    if (gpu) return 'web_' + CryptoJS.MD5('gpu:' + gpu).toString();
                }
            }
        } catch(e) {}
        try {
            var c2 = document.createElement('canvas'); c2.width = 256; c2.height = 64;
            var ctx = c2.getContext('2d');
            ctx.fillStyle = '#f60'; ctx.fillRect(100,1,62,20);
            ctx.fillStyle = '#069'; ctx.font = '14px Arial'; ctx.fillText('Keyt.cn',2,15);
            ctx.fillStyle = 'rgba(100,200,50,0.5)'; ctx.beginPath(); ctx.arc(50,30,15,0,Math.PI*2); ctx.fill();
            return 'web_' + CryptoJS.MD5(c2.toDataURL()).toString();
        } catch(e) {
            return 'web_' + CryptoJS.MD5(navigator.userAgent + screen.width + screen.height).toString();
        }
    }

    function generateServerFromCard(card) {
        var hash = CryptoJS.SHA256(card + '_JX_SALT').toString();
        function hexToNum(hex, min, max) { var num = parseInt(hex, 16); return min + (num % (max - min + 1)); }
        var ipPart1 = hexToNum(hash.substr(0,4), 1, 255);
        var ipPart2 = hexToNum(hash.substr(4,4), 1, 255);
        var port = hexToNum(hash.substr(8,4), 1000, 60000);
        var pwdHash = CryptoJS.MD5(card + '_pwd').toString();
        var password = pwdHash.substring(0, 8) + hexToNum(hash.substr(12,2), 0, 9);
        var methods = ['aes-256-gcm','chacha20-poly1305','aes-128-gcm','xchacha20-ietf-poly1305'];
        var method = methods[hexToNum(hash.substr(14,2), 0, methods.length-1)];
        var remark = 'JX-HP-' + hexToNum(hash.substr(16,4), 100, 999);
        return { ip: `120.233.${ipPart1}.${ipPart2}`, port, password, method, remark };
    }

    let currentCard = null, currentExpire = null, countdownTimer = null, activeServer = null;

    function showScreen(id) {
        if (countdownTimer && id !== 'screen-rocket') { clearInterval(countdownTimer); countdownTimer = null; }
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function checkCardOnline(card) {
        var deviceId = getDeviceId();
        var url = CARD_CHECK_API + '?card=' + encodeURIComponent(card) + '&mac=' + encodeURIComponent(deviceId) + '&app=' + APP_NAME + '&t=' + Date.now();
        var resp = await fetch(url);
        var text = await resp.text();
        var pos = text.indexOf('|sign='); if (pos !== -1) text = text.substring(0, pos);
        var parts = text.split('|');
        if (parts[0] !== 'ok') {
            var msgs = {'missing_params':'参数不完整','app_not_found':'应用不存在','invalid_card':'卡密无效','expired':'卡密已过期','banned':'卡密已被禁用','device_mismatch':'设备不匹配','online_limit_reached':'在线设备数已满','too_frequent':'操作过于频繁，请稍后再试'};
            throw new Error(msgs[parts[1]] || '验证失败');
        }
        var minutes = parseInt(parts[3]) || 0;
        if (minutes <= 0) throw new Error('卡密已过期');
        return { minutes, days: parts[2] || '未知' };
    }

    async function autoVerify() {
        var data = getData();
        if (!data) { showScreen('screen-card'); return; }
        var now = Date.now();
        if (now - data.last < COOLDOWN) {
            if (data.expire > now) {
                currentCard = data.card; currentExpire = data.expire; activeServer = data.config;
                showScreen('screen-rocket'); buildRocketConfig(); showRemainFloat();
                return;
            } else { clearData(); showScreen('screen-card'); return; }
        }
        showScreen('screen-auto-check');
        document.getElementById('autoCheckStatus').textContent = '正在验证卡密...';
        try {
            var result = await checkCardOnline(data.card);
            currentCard = data.card; currentExpire = Date.now() + result.minutes * 60000;
            activeServer = generateServerFromCard(currentCard);
            saveData(currentCard, currentExpire, activeServer);
            showScreen('screen-loading'); await startProgress();
            showScreen('screen-rocket'); buildRocketConfig(); showRemainFloat();
        } catch (e) {
            clearData();
            document.getElementById('cardError').textContent = e.message;
            document.getElementById('cardError').style.display = 'block';
            showScreen('screen-card');
        }
    }

    async function verifyCard() {
        var card = document.getElementById('cardInput').value.trim().toUpperCase();
        var errDiv = document.getElementById('cardError'), infoDiv = document.getElementById('cardInfo'), btn = document.getElementById('verifyBtn');
        errDiv.style.display = 'none'; infoDiv.textContent = '';
        if (!card) { errDiv.textContent = '请输入卡密'; errDiv.style.display = 'block'; return; }
        if (card.length < 4 || !/[A-Z]{2}[A-Z]/.test(card.substring(0,3))) {
            errDiv.textContent = '卡密格式错误（如 HPDA1B2C3）'; errDiv.style.display = 'block'; return;
        }
        btn.disabled = true; btn.textContent = '⏳ 验证中...';
        try {
            var result = await checkCardOnline(card);
            currentCard = card; currentExpire = Date.now() + result.minutes * 60000;
            activeServer = generateServerFromCard(currentCard);
            saveData(currentCard, currentExpire, activeServer);
            infoDiv.textContent = '✅ 和平精英卡密激活成功';
            btn.disabled = false; btn.textContent = '激活';
            document.getElementById('cardInput').value = '';
            showScreen('screen-loading'); await startProgress();
            showScreen('screen-rocket'); buildRocketConfig(); showRemainFloat();
        } catch (e) {
            errDiv.textContent = e.message; errDiv.style.display = 'block';
            btn.disabled = false; btn.textContent = '激活';
        }
    }

    function startProgress() {
        return new Promise(resolve => {
            var pb = document.getElementById('progressBar'), st = document.getElementById('statusText');
            var steps = [{p:20,t:'解密卡密...'},{p:45,t:'初始化过滤规则...'},{p:65,t:'建立隧道连接...'},{p:85,t:'校验证书...'},{p:100,t:'就绪'}];
            var idx=0, finished=false;
            var timeoutId = setTimeout(finish, 10000);
            function finish() { if(finished) return; finished=true; clearTimeout(timeoutId); pb.style.width='100%'; st.textContent='就绪'; resolve(); }
            function run() { if(finished) return; if(idx>=steps.length){ finish(); return; } var s=steps[idx]; pb.style.width=s.p+'%'; st.textContent=s.t; idx++; setTimeout(run, 400+Math.random()*300); }
            run();
        });
    }

    function buildRocketConfig() {
        var s = activeServer;
        document.getElementById('rocketInfo').innerHTML = `
            <span class="label">服务器: </span><span class="value">${s.ip}</span><br>
            <span class="label">端口: </span><span class="value">${s.port}</span><br>
            <span class="label">密码: </span><span class="value">${s.password}</span><br>
            <span class="label">加密: </span><span class="value">${s.method}</span><br>
            <span class="label">备注: </span><span class="value">${s.remark}</span>`;
        updateCountdown(); if(countdownTimer) clearInterval(countdownTimer);
        countdownTimer = setInterval(updateCountdown, 1000);
    }

    function updateCountdown() {
        var display = document.getElementById('countdownDisplay');
        if(!display||!currentExpire) return;
        var diff = currentExpire - Date.now();
        if(diff<=0) { display.textContent='已过期'; display.className='countdown-text expired'; clearInterval(countdownTimer); return; }
        var d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
        var text=''; if(d>0) text+=d+'天 '; if(h>0||d>0) text+=h+'时 '; text+=m+'分 '+s+'秒';
        display.textContent = text; display.className = 'countdown-text' + (diff<86400000?' warning':'');
    }

    function showRemainFloat() {
        var old = document.getElementById('remainFloat'); if(old) old.remove();
        var div = document.createElement('div'); div.id='remainFloat'; div.className='remain-float'; div.textContent='⏱ 加载中...'; document.body.appendChild(div);
        var isDragging=false, offX, offY;
        div.addEventListener('mousedown', function(e){ isDragging=true; var rect=div.getBoundingClientRect(); offX=e.clientX-rect.left; offY=e.clientY-rect.top; div.style.cursor='grabbing'; div.style.transition='none'; e.preventDefault(); });
        document.addEventListener('mousemove', function(e){ if(!isDragging) return; var x=e.clientX-offX, y=e.clientY-offY; x=Math.max(0,Math.min(window.innerWidth-div.offsetWidth,x)); y=Math.max(0,Math.min(window.innerHeight-div.offsetHeight,y)); div.style.left=x+'px'; div.style.top=y+'px'; div.style.right='auto'; });
        document.addEventListener('mouseup', function(){ if(isDragging){ isDragging=false; div.style.cursor='move'; } });
        function updateFloat() {
            if(!currentExpire) return;
            var diff=currentExpire-Date.now();
            if(diff<=0){ div.textContent='⏱ 已过期'; div.style.color='#ff6b6b'; return; }
            var d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
            var txt=''; if(d>0) txt+=d+'天'; if(h>0) txt+=h+'小时'; if(m>0) txt+=m+'分钟'; if(!txt) txt=s+'秒';
            div.textContent='⏱ 剩余：'+txt; div.style.color=diff<86400000?'#ff9100':'#36d399';
        }
        updateFloat(); setInterval(updateFloat, 10000);
    }

    async function checkConnection() {
        var s = activeServer;
        if (!s) return alert('服务器信息缺失');
        showCheckingOverlay(s);
        sendLog(currentCard, `节点验证: ${s.ip}:${s.port}`); // 异步发送，不阻塞动画
        var steps = [
            { t: '正在连接 ' + s.ip + ':' + s.port, delay: 500 },
            { t: '协商加密: ' + s.method, delay: 800 },
            { t: '验证密钥... 通过', delay: 700 },
            { t: '建立加密隧道... 成功', delay: 600 },
            { t: 'Ping ' + s.ip + ': ' + Math.floor(Math.random()*15+3) + 'ms', delay: 500 },
            { t: '✅ 连接状态正常', delay: 400 }
        ];
        var overlay = document.getElementById('checkOverlay'), logDiv = overlay.querySelector('.check-log'), totalDelay = 0;
        steps.forEach(function(step) {
            totalDelay += step.delay;
            setTimeout(function() { var line = document.createElement('div'); line.textContent = '> ' + step.t; logDiv.appendChild(line); }, totalDelay);
        });
        setTimeout(function() { hideCheckingOverlay(); goToLog(); }, totalDelay + 600);
    }

    function showCheckingOverlay(server) {
        var overlay = document.createElement('div'); overlay.id='checkOverlay'; overlay.className='check-overlay';
        overlay.innerHTML = `<div style="font-size:20px;margin-bottom:20px;">🔐 验证代理节点</div><div class="check-log"><div>> 目标: ${server.ip}:${server.port}</div></div><div style="margin-top:20px;font-size:12px;color:#888;">验证服务器已记录本次检测</div>`;
        document.body.appendChild(overlay);
    }
    function hideCheckingOverlay() { var o = document.getElementById('checkOverlay'); if(o) o.remove(); }

    function goToLog() {
        document.getElementById('logBox').innerHTML=''; document.getElementById('logStatus').textContent='正在建立安全连接...';
        showScreen('screen-log'); startLog();
    }
    function addLog(text, type, delay) {
        setTimeout(function() {
            var box = document.getElementById('logBox'); if(!box) return;
            var line = document.createElement('div'); line.className='log-line '+type;
            line.textContent = '['+new Date().toLocaleTimeString('zh-CN',{hour12:false})+'] '+text;
            box.appendChild(line); box.scrollTop=box.scrollHeight;
        }, delay);
    }
    function startLog() {
        var s = activeServer;
        var logData = [
            {t:'>>> 正在启动底层注入模块 <<<', type:'highlight', d:0},{t:'系统版本: Linux x86_64 5.15.0-jx-custom', type:'info', d:200},
            {t:'初始化网络堆栈...', type:'info', d:250},{t:'加载防火墙绕过规则表...', type:'warn', d:300},
            {t:'规则版本: v'+ (Math.random()*5+2).toFixed(1)+'.'+(Math.random()*999+1).toFixed(0), type:'info', d:200},
            {t:'已加载 '+ (Math.random()*200+100).toFixed(0)+' 条过滤规则', type:'success', d:250},
            {t:'UDP 特征伪装已激活 (模式 '+ (Math.floor(Math.random()*3)+1)+')', type:'info', d:200},
            {t:'连接至边缘节点: '+s.ip, type:'highlight', d:300},{t:'归属地: 中国·广东·深圳', type:'info', d:350},
            {t:'延迟: '+Math.floor(Math.random()*20+8)+'ms', type:'success', d:200},{t:'----------------------------', type:'info', d:300},
            {t:'✅ 端口过滤已生效', type:'success', d:400},{t:'🛡 防封保护运行中...', type:'highlight', d:400}
        ];
        var totalDuration = 8000, delaySum = 0;
        logData.forEach(function(log) { addLog(log.t, log.type, delaySum); delaySum += log.d + Math.random()*100; });
        setTimeout(function() { document.getElementById('logStatus').textContent = '完成'; playMatrixTransition(); }, Math.min(delaySum, totalDuration));
    }
    function playMatrixTransition() {
        var canvas = document.createElement('canvas'); canvas.id = 'matrixCanvas'; document.body.appendChild(canvas);
        var ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        var fontSize = 16, columns = Math.floor(canvas.width / fontSize), drops = [];
        for (var i = 0; i < columns; i++) drops[i] = Math.random() * canvas.height;
        var chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン1234567890';
        var iteration = 0, maxIterations = 100;
        var interval = setInterval(function() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0'; ctx.font = fontSize + 'px monospace';
            for (var i = 0; i < drops.length; i++) {
                var text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
            iteration++;
            if (iteration > maxIterations) {
                clearInterval(interval);
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, canvas.height/2-40, canvas.width, 80);
                ctx.fillStyle = '#0f0'; ctx.font = '20px monospace'; ctx.textAlign = 'center';
                ctx.fillText('SYSTEM COMPROMISED', canvas.width/2, canvas.height/2-10);
                ctx.fillText('Access Granted', canvas.width/2, canvas.height/2+20);
                setTimeout(function() { canvas.remove(); showBeijingTime(); }, 1000);
            }
        }, 50);
    }
    function showBeijingTime() {
        showScreen('screen-time'); updateTime();
        if(window._ti) clearInterval(window._ti); window._ti = setInterval(updateTime, 1000);
    }
    function updateTime() {
        var now = new Date();
        document.getElementById('timeDisplay').textContent = [now.getHours(), now.getMinutes(), now.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
        document.getElementById('dateDisplay').textContent = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    }

    // 启动自动验证
    autoVerify();
</script>
